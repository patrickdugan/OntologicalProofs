name: Recursive spectral Lean certificates

on:
  push:
    paths:
      - 'Neoplatonic/LTR/RecursiveSpectral.lean'
      - '.github/workflows/recursive-spectral-lean.yml'
      - 'lakefile.toml'
      - 'lean-toolchain'
  pull_request:
    paths:
      - 'Neoplatonic/LTR/RecursiveSpectral.lean'
      - '.github/workflows/recursive-spectral-lean.yml'
      - 'lakefile.toml'
      - 'lean-toolchain'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spectral:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Neoplatonic.LTR.RecursiveSpectral
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Independent source and axiom check
        run: |
          set -euo pipefail
          if grep -nE '\\b(sorry|admit|axiom|unsafe)\\b' Neoplatonic/LTR/RecursiveSpectral.lean; then
            echo 'Review prohibited Lean source construct above'
            exit 1
          fi
          lake env lean Neoplatonic/LTR/RecursiveSpectral.lean | tee recursive-spectral-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool' recursive-spectral-axioms.txt; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: recursive-spectral-axioms
          path: recursive-spectral-axioms.txt
