name: Storyworld CPU acceptance
on:
  push:
    paths: ['storyworld/**', '.github/workflows/storyworld-cpu.yml']
  pull_request:
    paths: ['storyworld/**', '.github/workflows/storyworld-cpu.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'gymnasium==1.2.2'
      - run: python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m storyworld.build_world build --out storyworld/worlds
      - run: python -m unittest discover -s storyworld/tests -v
      - run: python -m storyworld.oca smoke --out storyworld/receipts
      - uses: actions/upload-artifact@v4
        with:
          name: storyworld-cpu-evidence
          path: |
            storyworld/worlds/validation.json
            storyworld/receipts/
