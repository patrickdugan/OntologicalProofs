name: Grammy and Primes proof checks

on:
  pull_request:
    branches:
      - main
    paths:
      - 'grammy-and-primes/**'
      - '.github/workflows/grammy-and-primes.yml'
  workflow_dispatch:

concurrency:
  group: grammy-and-primes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Build existing Neoplatonic imports
        run: lake build Neoplatonic
      - name: Reproduce finite arithmetic tests
        run: python3 grammy-and-primes/experiment.py
      - name: Verify finite Möbius cancellation checkpoints
        run: python3 grammy-and-primes/mobius_experiment.py
      - name: Compile every new Lean script and report all errors
        shell: bash
        run: |
          status=0
          for file in grammy-and-primes/PrimeWheel.lean grammy-and-primes/RHGod.lean grammy-and-primes/SpectralSymmetry.lean; do
            echo "::group::$file"
            lake env lean "$file" || status=1
            echo "::endgroup::"
          done
          exit "$status"
