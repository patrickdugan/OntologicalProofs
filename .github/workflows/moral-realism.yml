name: Moral realism proof audit
on:
  pull_request:
    paths:
      - 'MoralRealism/**'
      - '.github/workflows/moral-realism.yml'
permissions:
  contents: read
concurrency:
  group: moral-realism-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python and source checks
        run: python3 MoralRealism/verify.py --python-only
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Kernel compilation and dependency audit
        run: python3 MoralRealism/verify.py --output "$RUNNER_TEMP/moral-realism-verification.json"
